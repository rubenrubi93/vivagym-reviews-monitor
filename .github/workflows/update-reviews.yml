name: Actualizar reseñas VivaGym

on:
  schedule:
    - cron: "17 7 * * *"
      timezone: "Europe/Madrid"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-vivagym-reviews
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Consultar Google Places y actualizar histórico
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python scripts/update_reviews.py

      - name: Guardar cambios
        run: |
          if git diff --quiet -- data/reviews.json; then
            echo "No hay cambios en las reseñas."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reviews.json
          git commit -m "Actualizar valoraciones VivaGym automáticamente"
          git push
